<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>考試工具</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffc800;--cream:#fff6e9;--card:#fff;--ink:#5a4636;--mut:#a38b78;--pink:#ff8fab;--mint:#7bd8b0;--sun:#ffc857;--sky:#8ecae6;--line:#ffe0b8;--ts:1}
*{box-sizing:border-box}
html{font-size:16px}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
background-image:radial-gradient(rgba(255,255,255,.35) 2px,transparent 2px);background-size:26px 26px}
button,input{font:inherit;color:inherit}
header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 18px;background:#fff;border-bottom:4px dashed var(--pink)}
.logo{font-size:1.5rem;font-weight:900;display:flex;align-items:center;gap:8px}.logo svg{display:block}
.logo span{display:inline-block;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px) rotate(8deg)}}
.btn{border:0;border-radius:999px;padding:.4em 1em;background:var(--sun);font-weight:700;cursor:pointer;box-shadow:0 3px 0 #e0a92e;transition:.1s}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn.pink{background:var(--pink);box-shadow:0 3px 0 #e06a89;color:#fff}
.btn.mint{background:var(--mint);box-shadow:0 3px 0 #4fb48a}
.btn.sky{background:var(--sky);box-shadow:0 3px 0 #5fa4c4}
.sp{flex:1}
#title{font-size:calc(1.2rem*var(--ts));font-weight:900;border:2px dashed transparent;border-radius:12px;padding:.2em .6em;background:transparent;text-align:right;width:min(16em,100%)}
#title:hover,#title:focus{border-color:var(--pink);outline:0;background:#fff8fb}
main{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:18px}
@media(max-width:820px){main{grid-template-columns:1fr}}
.col{display:flex;flex-direction:column;gap:16px;min-width:0}
.card{background:var(--card);border:3px solid var(--line);border-radius:24px;padding:16px;box-shadow:0 6px 0 var(--line)}
#now{text-align:center;font-size:calc(1.5rem*var(--ts));font-weight:900;padding:20px 12px;background:#fff0f4;border-color:#ffc7d6;box-shadow:0 6px 0 #ffc7d6}
#now small{display:block;font-size:calc(.85rem*var(--ts));color:var(--mut);font-weight:500;margin-top:4px}
table{width:100%;border-collapse:separate;border-spacing:0 8px}
th{color:var(--mut);font-size:.85rem;text-align:left;padding:0 6px}
td{font-size:1rem;background:#fffaf2;padding:6px;vertical-align:middle}
td:first-child{border-radius:14px 0 0 14px}td:last-child{border-radius:0 14px 14px 0}
tr.cur td{background:#fff0f4;outline:0}
td input{border:2px solid transparent;border-radius:10px;background:transparent;padding:.3em .4em;width:100%;cursor:text}
td input:hover,td input:focus{border-color:var(--sun);background:#fff;outline:0}
td input.t,td input.h,td input.mi{width:5.6em;min-width:5.6em;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:.03em;padding:.3em .2em}
.times{gap:2px!important}.st{gap:0!important}.st b{margin:0 1px}th:nth-child(n+2),td:nth-child(n+2){width:1%;white-space:nowrap}
td:nth-child(2){padding-right:14px}th:nth-child(2){padding-left:6px}
td input.h,td input.mi{width:calc(2ch + 23px);min-width:0!important;font-size:.9em;padding:.25em 0 .25em .2em!important;text-align:right;padding:.3em .2em}
.st b{color:var(--mut);margin:0 -2px 0 -3px!important}
td input.mi{text-align:left!important;padding-left:.1em!important}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{opacity:1;height:1.8em;cursor:pointer}
input[type=number]{-moz-appearance:number-input}
.st{display:flex;align-items:center;gap:3px}
.sb{border:0;border-radius:50%;width:1.9em;height:1.9em;flex:none;background:var(--sun);font-weight:900;cursor:pointer;box-shadow:0 2px 0 #e0a92e;line-height:1;user-select:none;touch-action:manipulation}
.sb:active{transform:translateY(2px);box-shadow:none}
.sb.m{background:var(--pink);box-shadow:0 2px 0 #e06a89;color:#fff}
#stepSel{border:2px solid var(--line);border-radius:999px;padding:.3em .6em;background:#fff;font-weight:700}
.times{display:flex;align-items:center;gap:2px;white-space:nowrap}
.badge{display:inline-block;padding:.2em .8em;border-radius:999px;font-size:.85em;font-weight:700;white-space:nowrap}
.s-wait{background:#dff3ff;color:#2f7ea5}.s-on{background:#ffe0e8;color:#d6405f;animation:pulse 1.2s infinite}.s-end{background:#e8e8e8;color:#888}
@keyframes pulse{50%{transform:scale(1.08)}}
.del{border:0;background:transparent;cursor:pointer;font-size:1.1rem;border-radius:50%;width:2em;height:2em}
.del:hover{background:#ffe0e8}
.empty{text-align:center;color:var(--mut);padding:24px 0}
#clock{font-family:"Orbitron","Audiowide",Consolas,"Courier New",monospace;text-align:center;font-size:calc(clamp(1.8rem,4.6vw,3.2rem)*var(--ts));font-weight:900;letter-spacing:.04em;white-space:nowrap;font-variant-numeric:tabular-nums}
#clock i{font-style:normal;color:var(--pink);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}
.bar-wrap{position:relative;height:2.2rem;background:#fff4d6;border-radius:999px;border:3px solid var(--sun);overflow:hidden}
#bar{height:100%;width:0;background:linear-gradient(90deg,#9be7c4,#7bd8b0);border-radius:999px;transition:width .6s,background .6s}
#bar.low{background:linear-gradient(90deg,#ffb3c6,#ff8fab)}
#barTxt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:calc(.85rem*var(--ts))}
#bar-label{font-size:calc(.85rem*var(--ts));color:var(--mut);margin-bottom:6px;text-align:center}
#notice{font-family:inherit;background:transparent!important;flex:1;min-height:11rem;width:100%;border:0;resize:none;background:#fffbe6;border-radius:16px;padding:12px;font-size:calc(1.15rem*var(--ts));line-height:1.7;outline:0}
#noticeCard{background-color:var(--cream);background-image:radial-gradient(#ffe9c9 2px,transparent 2px);background-size:26px 26px}
.ntitle{font-size:calc(1rem*var(--ts));font-weight:900;margin-bottom:8px;text-align:center}
#tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
#resetBtn{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:.85rem}
#resetBtn:active{transform:translateY(calc(-50% + 3px))}
@media(max-width:700px){#resetBtn{position:static;transform:none}}
footer{position:relative;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:12px;background:#fff;border-top:4px dashed var(--sky)}
.tab{border:0;border-radius:18px 18px 4px 4px;padding:.4em 1.2em;background:#eef6fa;font-weight:700;cursor:pointer}
.tab.on{background:var(--sky);color:#fff}
.tab .x{margin-left:6px;opacity:.7}
</style>
</head>
<body>
<header>
  <div class="logo"><span><svg width="38" height="44" viewBox="0 0 38 44" aria-hidden="true"><g transform="rotate(-6 19 22)"><rect x="3" y="2" width="32" height="40" rx="4" fill="#fff" stroke="#5a4636" stroke-width="2.2"/><path d="M8 11h14M8 16h10M8 38h22" stroke="#cdbfae" stroke-width="2" stroke-linecap="round"/><text x="20" y="31" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="15" fill="#ff4d6d" stroke="#ff4d6d" stroke-width=".4" transform="rotate(-8 20 27)">100</text><path d="M9 33.5q11 4 22-1" stroke="#ff4d6d" stroke-width="1.8" fill="none" stroke-linecap="round"/></g></svg></span> 考試工具</div>
  <button class="btn mint" onclick="addSubject()">➕ 新增科目</button>
  <button class="btn sky" onclick="document.getElementById('file').click()">📥 匯入</button>
  <button class="btn sky" onclick="exportData()">📤 匯出</button>
  <button class="btn pink" onclick="fs(1)">A+</button>
  <button class="btn pink" onclick="fs(-1)" style="font-size:.8em">A-</button>
  <span class="sp"></span>
  <input id="title" title="點一下可重新命名" oninput="cur().title=this.value;save()">
  <input type="file" id="file" accept=".json" hidden onchange="importData(this)">
</header>

<main>
  <div class="col">
    <div class="card" id="now"></div>
    <div class="card">
      <table>
        <thead><tr><th>科目</th><th>時間</th><th>狀態</th><th></th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="empty" id="empty" hidden>🌱 還沒有科目，按上方「新增科目」吧！</div>
    </div>
  </div>
  <div class="col">
    <div class="card">
      <div id="clock">00<i>:</i>00<i>:</i>00</div>
    </div>
    <div class="card">
      <div id="bar-label">⚡ 能量條</div>
      <div class="bar-wrap"><div id="bar"></div><div id="barTxt"></div></div>
    </div>
    <div class="card" id="noticeCard" style="flex:1;display:flex;flex-direction:column">
      <div class="ntitle">📢 公告</div>
      <textarea id="notice" placeholder="在這裡寫公告、考試規則…" oninput="cur().notice=this.value;save()"></textarea>
    </div>
  </div>
</main>

<footer><button class="btn pink" id="resetBtn" onclick="resetAll()">🔄 重設</button><div id="tabs"></div></footer>

<script>
const KEY="cuteExamTool_v1";
let D=load(),active=D.days[0].id;
function uid(){return"x"+Math.random().toString(36).slice(2,9)}
function def(){return{fs:16,days:[{id:uid(),title:"第1天段考",date:"",notice:"1. 桌面清空，只留文具\n2. 考試期間請保持安靜",subjects:[
  {id:uid(),name:"國文",start:"08:40",end:"09:30"},{id:uid(),name:"數學",start:"09:50",end:"10:40"}]}]}}
function load(){try{const r=JSON.parse(localStorage.getItem(KEY));if(r&&r.days&&r.days.length)return r}catch(e){}return def()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}}
function cur(){return D.days.find(d=>d.id===active)||D.days[0]}
const $=id=>document.getElementById(id);
const toMin=t=>{if(!t)return null;const[a,b]=t.split(":");return+a*60+ +b};
const pad=n=>String(n).padStart(2,"0");
const fmtMin=m=>pad(Math.floor(m/60))+":"+pad(m%60);

function fs(n){D.fs=Math.min(28,Math.max(11,(D.fs||16)+n*2));document.documentElement.style.setProperty("--ts",D.fs/16);save()}

function renderTabs(){
  $("tabs").innerHTML="";
  D.days.forEach((d,i)=>{
    const b=document.createElement("button");b.className="tab"+(d.id===active?" on":"");b.textContent="Day"+(i+1);
    if(d.id===active&&D.days.length>1){const x=document.createElement("span");x.className="x";x.textContent="✕";x.title="刪除這一天";
      x.onclick=e=>{e.stopPropagation();if(confirm("確定刪除 Day"+(i+1)+" 嗎？")){D.days=D.days.filter(z=>z.id!==d.id);active=D.days[0].id;save();renderAll()}};b.appendChild(x)}
    b.onclick=()=>{active=d.id;renderAll()};$("tabs").appendChild(b)});
  const a=document.createElement("button");a.className="tab";a.textContent="＋新增考試日";
  a.onclick=()=>{const n=D.days.length+1;const d={id:uid(),title:"第"+n+"天段考",date:"",notice:"",subjects:[]};D.days.push(d);active=d.id;save();renderAll()};
  $("tabs").appendChild(a);
}

function sorted(){cur().subjects.sort((a,b)=>(toMin(a.start)??9999)-(toMin(b.start)??9999))}
function renderRows(){
  sorted();const tb=$("rows");tb.innerHTML="";const d=cur();
  $("empty").hidden=d.subjects.length>0;
  d.subjects.forEach(s=>{
    const tr=document.createElement("tr");tr.id="r_"+s.id;
    tr.innerHTML=`<td><input value="" placeholder="科目" title="點一下編輯"></td>
      <td class="tc"><div class="times"><div class="st"><input class="h" type="number" min="0" max="23" placeholder="時"><b>:</b><input class="mi" type="number" min="0" max="59" placeholder="分"></div><span>~</span><div class="st"><input class="h" type="number" min="0" max="23" placeholder="時"><b>:</b><input class="mi" type="number" min="0" max="59" placeholder="分"></div></div></td>
      <td><span class="badge"></span></td><td><button class="del" title="刪除">🗑️</button></td>`;
    const ins=tr.querySelectorAll("input");
    ins[0].value=s.name;
    ins[0].oninput=()=>{s.name=ins[0].value;save();tick()};
    [["start",1],["end",3]].forEach(([k,i])=>{
      const h=ins[i],m=ins[i+1],v=toMin(s[k]);
      if(v!=null){h.value=pad(Math.floor(v/60));m.value=pad(v%60)}
      m.step=1;
      const upd=()=>{
        if(h.value===""||m.value==="")return;
        s[k]=pad(Math.min(23,Math.max(0,+h.value)))+":"+pad(Math.min(59,Math.max(0,+m.value)));
        save();tick();clearTimeout(reT);reT=setTimeout(renderRows,1200);
      };
      h.oninput=upd;m.oninput=upd;
      h.onkeydown=e=>{if(e.key!=="ArrowUp"&&e.key!=="ArrowDown")return;e.preventDefault();
        const d=e.key==="ArrowUp"?1:-1;h.value=pad(((+h.value||0)+d+24)%24);upd()};
      m.onkeydown=e=>{if(e.key!=="ArrowUp"&&e.key!=="ArrowDown")return;e.preventDefault();
        const d=e.key==="ArrowUp"?1:-1,stp=1;let v=(+m.value||0)+d*stp,hh=+h.value||0;
        if(v>59){v-=60;hh=(hh+1)%24}else if(v<0){v+=60;hh=(hh+23)%24}
        h.value=pad(hh);m.value=pad(v);upd()};
      h.onchange=()=>{if(h.value!=="")h.value=pad(+h.value)};
      m.onchange=()=>{if(m.value!=="")m.value=pad(+m.value)};
    });
    tr.querySelector(".del").onclick=()=>{if(confirm("刪除「"+(s.name||"這個科目")+"」？")){d.subjects=d.subjects.filter(z=>z.id!==s.id);save();renderRows();tick()}};
    tb.appendChild(tr)});
}
function normT(v,old){ // 24小時制：接受 8:40 / 840 / 0840
  v=v.trim().replace(/[：.]/g,":");let h,m,x;
  if(x=v.match(/^(\d{1,2}):(\d{1,2})$/)){h=+x[1];m=+x[2]}
  else if(x=v.match(/^(\d{1,2})(\d{2})$/)){h=+x[1];m=+x[2]}
  else return old||"";
  if(h>23||m>59)return old||"";
  return pad(h)+":"+pad(m);
}
let reT=null;
function addSubject(){
  const d=cur();const last=d.subjects[d.subjects.length-1];
  const st=last&&last.end?toMin(last.end)+10:8*60+40;
  d.subjects.push({id:uid(),name:"新科目",start:fmtMin(st),end:fmtMin(st+40)});
  save();renderRows();tick();
  const r=$("rows").lastElementChild;if(r){const i=r.querySelector("input");i.focus();i.select()}
}

// status: 0 wait, 1 on, 2 end
function dayMode(d,now){return"today"; // before/after/today
  if(!d.date)return"today";
  const t=now.getFullYear()+"-"+pad(now.getMonth()+1)+"-"+pad(now.getDate());
  return d.date<t?"past":d.date>t?"future":"today";
}
function status(s,mode,m){
  if(mode==="past")return 2;if(mode==="future")return 0;
  const a=toMin(s.start),b=toMin(s.end);
  if(a==null||b==null)return 0;
  return m<a?0:m>=b?2:1;
}
const ST=[["尚未開始","s-wait"],["考試中","s-on"],["已結束","s-end"]];

function tick(){
  const now=new Date(),d=cur(),mode=dayMode(d,now);
  const sec=now.getHours()*3600+now.getMinutes()*60+now.getSeconds(),m=sec/60;
  $("clock").innerHTML=`${pad(now.getHours())}<i>:</i>${pad(now.getMinutes())}<i>:</i>${pad(now.getSeconds())}`;
  let on=null,next=null;
  d.subjects.forEach(s=>{
    const st=status(s,mode,m),tr=$("r_"+s.id);
    if(tr){const b=tr.querySelector(".badge");b.textContent=ST[st][0];b.className="badge "+ST[st][1];tr.classList.toggle("cur",st===1)}
    if(st===1&&!on)on=s;
    if(st===0&&mode==="today"&&toMin(s.start)!=null&&!next)next=s;
  });
  const box=$("now"),bar=$("bar"),txt=$("barTxt"),lab=$("bar-label");
  let pct=0,t="",low=false;
  if(mode==="past"){box.innerHTML="🎉 這一天已經考完囉";pct=0;t="已結束";lab.textContent="⚡ 能量條"}
  else if(mode==="future"){box.innerHTML="📅 這天還沒到喔<small>"+d.date+"</small>";t="尚未開始";lab.textContent="⚡ 能量條"}
  else if(on){
    const a=toMin(on.start)*60,b=toMin(on.end)*60,left=Math.max(0,b-sec);
    box.innerHTML="✏️ 現在考試："+esc(on.name||"（未命名）")+"<small>"+on.start+" ~ "+on.end+"</small>";
    pct=left/(b-a)*100;low=left<600;lab.textContent="⚡ 考試剩餘時間";t="剩 "+Math.floor(left/60)+" 分 "+pad(left%60)+" 秒";
  }else if(next){
    const a=toMin(next.start)*60,left=a-sec;
    const prev=d.subjects.filter(s=>status(s,mode,m)===2).map(s=>toMin(s.end)*60).sort((x,y)=>y-x)[0];
    box.innerHTML=(prev!=null?"☕ 休息時間":"🌤️ 考試尚未開始")+"<small>下一科："+esc(next.name)+"（"+next.start+"）</small>";
    const span=prev!=null?a-prev:Math.max(left,1800);pct=Math.min(100,left/span*100);
    lab.textContent="⚡ 距離下一科";t="還有 "+Math.floor(left/60)+" 分 "+pad(left%60)+" 秒";
  }else{
    box.innerHTML=d.subjects.length?"🎉 今天的考試都結束了":"🌱 今天還沒有安排科目";pct=0;t="";lab.textContent="⚡ 能量條"}
  bar.style.width=pct+"%";bar.classList.toggle("low",low);txt.textContent=t;
}
function esc(s){return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}

function renderAll(){
  const d=cur();$("title").value=d.title;$("notice").value=d.notice||"";
  document.documentElement.style.setProperty("--ts",(D.fs||16)/16);
  renderTabs();renderRows();tick();save();
}

function resetAll(){
  if(!confirm("確定要重設嗎？所有考試日、科目和公告都會恢復成預設內容。"))return;
  D=def();active=D.days[0].id;save();renderAll();
}
function exportData(){
  const j=JSON.stringify(D,null,2);
  try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([j],{type:"application/json"}));a.download="exam-data.json";a.click()}catch(e){}
  try{navigator.clipboard.writeText(j)}catch(e){}
}
function importData(el){
  const f=el.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const o=JSON.parse(r.result);if(!o.days||!o.days.length)throw 0;D=o;active=D.days[0].id;renderAll()}catch(e){alert("檔案格式不正確 😢")}};
  r.readAsText(f);el.value="";
}
renderAll();setInterval(tick,1000);
</script>
</body>
</html>
