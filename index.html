<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>考試工具</title>
<link rel="icon" type="image/x-icon" href="https://raw.githubusercontent.com/hihimax77/exam-tool/refs/heads/main/healthicons--i-exam-qualification_ico_256x256.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff7c9;--ink:#3f5468;--mut:#6f8aa0;
--blue:#d9eefb;--blue-d:#a9d6ef;--blue-t:#2f7ea5;
--green:#ddf5e7;--green-d:#a6e0c2;--green-t:#2f8a62;
--pink:#ffe3ec;--pink-d:#ffb8cc;--pink-t:#d6405f;--tn:1;--tc:1}
*{box-sizing:border-box}
html{font-size:16px}
body{margin:0;height:100vh;min-height:560px;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}
button,input,textarea{font:inherit;color:inherit}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{opacity:1;height:1.8em;cursor:pointer}
input[type=number]{-moz-appearance:number-input}

/* 上方列 */
header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 18px;background:var(--blue);border-bottom:4px dashed var(--pink-d)}
.logo{font-size:1.5rem;font-weight:900;display:flex;align-items:center;gap:8px}.logo svg{display:block}
.logo span{display:inline-block;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px) rotate(8deg)}}
.btn{border:0;border-radius:999px;padding:.4em 1em;background:var(--blue-d);font-weight:700;cursor:pointer;box-shadow:0 3px 0 #86bddb;transition:.1s;color:var(--ink)}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn.pink{background:var(--pink-d);box-shadow:0 3px 0 #f090ab}
.btn.mint{background:var(--green-d);box-shadow:0 3px 0 #7fc6a2}
.sp{flex:1}
#title{font-size:1.2rem;font-weight:900;border:2px dashed transparent;border-radius:12px;padding:.2em .6em;background:transparent;text-align:right;width:min(16em,100%)}
#title:hover,#title:focus{border-color:var(--pink-d);outline:0;background:var(--pink)}

/* 主版面 */
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.16fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;gap:4.5vh 2.6vw;padding:4vh 4vw 2vh}
.col{display:flex;flex-direction:column;gap:1.5vh;min-width:0;min-height:0}
.card{border:3px solid;border-radius:24px;padding:14px}

.zb{position:absolute;top:10px;right:14px;display:flex;gap:6px;z-index:2}
.zb .btn{padding:.15em .75em;font-size:.85rem}
#nowCard,#noticeCard{position:relative}
/* 現在考試（[1]）：外框固定，字隨 A+/A- 放大縮小 */
#nowCard{flex:3.6 1 0;min-height:0;display:flex;flex-direction:column;padding:2vh 4%;background:var(--pink);border-color:var(--pink-d);box-shadow:0 6px 0 var(--pink-d)}
#now{flex:1;min-height:90px;padding-top:2.2rem;container-type:size;overflow:hidden;display:flex;text-align:left;font-weight:700;--fit:1}
#now .ni{margin-top:auto;max-width:100%;display:flex;flex-wrap:wrap;align-items:baseline;gap:0 .6em}
#now .nm{font-size:calc(max(30px,min(6vw,9.8vh))*var(--tn)*var(--fit));line-height:1.1;word-break:break-all}
#now small{display:block;font-size:calc(max(14px,min(2.7vw,4.3vh))*var(--tn)*var(--fit));color:var(--mut);font-weight:700}
#bar-label{display:none}
#barBox{margin-top:1.2vh}
.bar-wrap{position:relative;height:clamp(2.2rem,8vh,3.6rem);background:var(--green);border-radius:999px;border:3px solid var(--green-d);overflow:hidden}
#bar{height:100%;width:0;background:linear-gradient(90deg,#b5ecd0,#8fdcb7);border-radius:999px;transition:width .6s,background .6s}
#bar.low{background:linear-gradient(90deg,#ffd0dd,#ffa3bc)}
#barTxt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:clamp(.95rem,2.2vh,1.4rem)}

/* 時鐘 */
#clockCard{flex:.7 1 0;min-height:70px;container-type:size;display:flex;align-items:center;justify-content:center;background:var(--blue);border-color:var(--blue-d);box-shadow:0 6px 0 var(--blue-d)}
#clock{font-family:"Orbitron","Audiowide",Consolas,"Courier New",monospace;text-align:center;line-height:1;font-size:min(15cqw,100cqh);font-weight:900;letter-spacing:.04em;white-space:nowrap;font-variant-numeric:tabular-nums}
#clock i{font-style:normal;color:var(--pink-t);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.2}}

/* 應到 已到 未到 */
#att{flex:none;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5%;padding:0 4%}
.abox{min-height:0;border:3px solid;border-radius:20px;padding:1vh 10px;display:flex;flex-direction:column;gap:.15em;background:var(--blue);border-color:var(--blue-d);box-shadow:0 5px 0 var(--blue-d)}
.abox.a2{background:var(--green);border-color:var(--green-d);box-shadow:0 5px 0 var(--green-d)}
.abox.a3{background:var(--pink);border-color:var(--pink-d);box-shadow:0 5px 0 var(--pink-d)}
.abox label{font-size:clamp(1.5rem,4.6vh,2.5rem);line-height:1.1;font-weight:800;color:var(--mut)}
.abox input{width:100%;min-width:0;border:2px solid transparent;border-radius:10px;background:transparent;text-align:center;font-size:clamp(1.6rem,5vh,2.6rem);font-weight:900;padding:.05em}
.abox input:hover,.abox input:focus{border-color:var(--blue-d);background:rgba(255,255,255,.55);outline:0}

/* 公告：字隨 A+/A- 放大縮小 */
#noticeCard{flex:1 1 0;min-height:0;display:flex;flex-direction:column;background:var(--green);border-color:var(--green-d);box-shadow:0 6px 0 var(--green-d)}
.ntitle{font-size:1rem;font-weight:900;margin-bottom:6px;text-align:center}
#notice{flex:1;min-height:0;width:100%;border:0;resize:none;background:transparent;border-radius:16px;padding:8px 12px;font-size:calc(max(14px,min(2.8vh,1.6vw))*var(--tc));font-weight:700;line-height:1.5;outline:0;overflow:auto}

/* 科目方塊（[2]）與 ＋（[3]） */
#subRow{grid-column:1/-1;display:flex;gap:clamp(12px,2.6vw,40px);min-width:0;overflow-x:auto;overflow-y:hidden;padding:2px 2px 8px}
.blk{flex:1 1 0;min-width:6rem;container-type:inline-size;display:flex;flex-direction:column;gap:4px;text-align:left;overflow:hidden;border:3px solid;border-radius:22px;padding:10px 12px;cursor:pointer;transition:flex-grow .25s}
.blk.c0{background:var(--blue);border-color:var(--blue-d);box-shadow:0 5px 0 var(--blue-d)}
.blk.c1{background:var(--green);border-color:var(--green-d);box-shadow:0 5px 0 var(--green-d)}
.blk.c2{background:var(--pink);border-color:var(--pink-d);box-shadow:0 5px 0 var(--pink-d)}
.blk.cur{box-shadow:inset 0 0 0 4px #ff8fab,0 5px 0 var(--pink-d)}
.blk:active{transform:translateY(3px)}
.bn{font-size:clamp(.9rem,9cqw,1.4rem);font-weight:900;line-height:1.15;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-all}
.bm{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:4px}
.bt{font-size:clamp(.65rem,6cqw,.9rem);font-weight:700;color:var(--mut);font-variant-numeric:tabular-nums}
.bt span{white-space:nowrap}
.badge{display:inline-block;padding:.15em .7em;border-radius:999px;font-size:.7rem;font-weight:700;white-space:nowrap}
.s-wait{background:#c3e4f7;color:var(--blue-t)}.s-on{background:var(--pink-d);color:#b52a49;animation:pulse 1.2s infinite}.s-end{background:var(--green-d);color:var(--green-t)}
@keyframes pulse{50%{transform:scale(1.08)}}
.blk.plus{flex:none;min-width:0;width:7vw;min-width:56px;align-self:center;min-height:3.2rem;align-items:center;justify-content:center;font-size:2.6rem;font-weight:900;background:var(--green);border-color:var(--green-d);border-style:dashed;box-shadow:none;color:var(--green-t)}
.empty{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;color:var(--mut);font-weight:700}

/* 下方列 */
footer{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:10vh;padding:8px 4vw;background:var(--green);border-top:4px dashed var(--blue-d)}
#footBtns{display:flex;gap:8px;justify-self:start}#footBtns .btn{font-size:.9rem}
#tabs{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;justify-content:center;grid-column:2}
.tab{border:0;border-radius:18px 18px 4px 4px;padding:.4em 1.2em;background:var(--blue);font-weight:700;cursor:pointer;color:var(--ink)}
.tab.on{background:var(--blue-d)}
.tab .x{margin-left:6px;opacity:.7}

/* 編輯科目小視窗 */
#mdOverlay{position:fixed;inset:0;z-index:900;display:flex;align-items:center;justify-content:center;background:rgba(140,185,215,.5);padding:16px}
#mdOverlay[hidden]{display:none}
#md{width:min(360px,100%);background:var(--blue);border:4px solid var(--blue-d);border-radius:26px;box-shadow:0 8px 0 var(--blue-d);padding:18px;display:flex;flex-direction:column;gap:12px;animation:tuPop .25s ease-out}
.mdh{display:flex;align-items:center;justify-content:space-between;font-size:1.2rem;font-weight:900}
.mdDel{border:0;background:var(--pink);border-radius:999px;padding:.25em .8em;font-size:.85rem;font-weight:700;cursor:pointer;color:var(--pink-t)}
.mf{display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:800}
#mdName{width:11em;max-width:65%;border:2px solid var(--green-d);border-radius:12px;background:#f6fffa;padding:.35em .6em;outline:0}
.tm{display:flex;align-items:center;gap:2px}
.tm input{width:4.4em;border:2px solid var(--green-d);border-radius:12px;background:#f6fffa;padding:.35em .3em .35em .5em;text-align:center;font-weight:800;font-variant-numeric:tabular-nums;outline:0}
#mdName:focus,.tm input:focus{border-color:#ff8fab}
.mdb{display:flex;gap:10px;justify-content:flex-end;margin-top:4px}
.mdb .btn{padding:.45em 1.4em}

/* 時間到提示 */
#tuOverlay{position:fixed;inset:0;z-index:999;display:flex;align-items:center;justify-content:center;background:rgba(140,185,215,.55);padding:16px;cursor:pointer}
#tuOverlay[hidden]{display:none}
#tuBox{background:var(--pink);border:6px solid var(--pink-d);border-radius:36px;box-shadow:0 10px 0 var(--pink-d);padding:clamp(24px,5vw,56px) clamp(28px,7vw,90px);text-align:center;animation:tuPop .4s ease-out;max-width:100%}
#tuBox .bell{display:inline-block;font-size:clamp(3rem,10vw,6rem);line-height:1;animation:ring .5s ease-in-out infinite}
#tuBox .big{font-size:clamp(2.2rem,8vw,5.5rem);font-weight:900;color:var(--pink-t);line-height:1.25}
#tuSub{font-size:clamp(1rem,2.5vw,1.6rem);font-weight:700;color:var(--mut);margin-top:8px}
@keyframes tuPop{from{transform:scale(.6);opacity:0}}
@keyframes ring{0%,100%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}}

@media(max-width:820px){
  body{height:auto;min-height:100vh}
  main{grid-template-columns:1fr;grid-template-rows:none}
  .col{min-height:auto}
  .col.L{min-height:440px}
  #noticeCard{min-height:220px}
  #subRow{min-height:150px}
  footer{grid-template-columns:1fr;justify-items:center}
  #tabs{grid-column:1}
}
</style>
</head>
<body>
<header>
  <div class="logo"><span><svg width="38" height="44" viewBox="0 0 38 44" aria-hidden="true"><g transform="rotate(-6 19 22)"><rect x="3" y="2" width="32" height="40" rx="4" fill="#fff" stroke="#5a4636" stroke-width="2.2"/><path d="M8 11h14M8 16h10M8 38h22" stroke="#cdbfae" stroke-width="2" stroke-linecap="round"/><text x="20" y="31" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="15" fill="#ff4d6d" stroke="#ff4d6d" stroke-width=".4" transform="rotate(-8 20 27)">100</text><path d="M9 33.5q11 4 22-1" stroke="#ff4d6d" stroke-width="1.8" fill="none" stroke-linecap="round"/></g></svg></span> 考試工具</div>
  <button class="btn sky" onclick="exportData()">📤 匯出</button>
  <button class="btn sky" onclick="document.getElementById('file').click()">📥 匯入</button>
  <span class="sp"></span>
  <input id="title" title="點一下可重新命名" oninput="cur().title=this.value;save()">
  <input type="file" id="file" accept=".json" hidden onchange="importData(this)">
</header>

<main>
  <div class="col L">
    <div class="card" id="nowCard">
      <div class="zb"><button class="btn sky" onclick="zoom('now',1)" title="放大考試科目的字">A+</button><button class="btn sky" onclick="zoom('now',-1)" title="縮小考試科目的字">A-</button></div>
      <div id="now"></div>
      <div id="barBox"><div id="bar-label">⚡ 能量條</div><div class="bar-wrap"><div id="bar"></div><div id="barTxt"></div></div></div>
    </div>
    <div class="card" id="clockCard"><div id="clock">00<i>:</i>00<i>:</i>00</div></div>
  </div>
  <div class="col R">
    <div id="att">
      <div class="abox"><label for="a_should">應到</label><input id="a_should" type="number" min="0" step="1" value="0" inputmode="numeric" oninput="attIn('should')" onchange="attFix('should')"></div>
      <div class="abox a2"><label for="a_here">已到</label><input id="a_here" type="number" min="0" step="1" value="0" inputmode="numeric" oninput="attIn('here')" onchange="attFix('here')"></div>
      <div class="abox a3"><label for="a_absent">未到</label><input id="a_absent" type="number" min="0" step="1" value="0" inputmode="numeric" oninput="attIn('absent')" onchange="attFix('absent')"></div>
    </div>
    <div class="card" id="noticeCard">
      <div class="zb"><button class="btn pink" onclick="zoom('notice',1)" title="放大公告的字">A+</button><button class="btn pink" onclick="zoom('notice',-1)" title="縮小公告的字">A-</button></div>
      <div class="ntitle">📢 公告</div>
      <textarea id="notice" placeholder="在這裡寫公告、考試規則…" oninput="cur().notice=this.value;save()"></textarea>
    </div>
  </div>
  <div id="subRow"></div>
</main>

<footer><div id="footBtns"><button class="btn pink" id="resetBtn" onclick="resetAll()">🔄 重設</button><button class="btn sky" id="fsBtn" onclick="toggleFull()">⛶ 全螢幕</button></div><div id="tabs"></div></footer>

<div id="mdOverlay" hidden><div id="md" role="dialog" aria-modal="true">
  <div class="mdh"><span id="mdTitle">編輯科目</span><button class="mdDel" id="mdDel" onclick="mdDelete()">🗑️ 刪除</button></div>
  <label class="mf">科目<input id="mdName" placeholder="例如：國文" maxlength="20"></label>
  <div class="mf">開始時間<div class="tm"><input id="mdSh" type="number" min="0" max="23" placeholder="時"><b>:</b><input id="mdSm" type="number" min="0" max="59" placeholder="分"></div></div>
  <div class="mf">結束時間<div class="tm"><input id="mdEh" type="number" min="0" max="23" placeholder="時"><b>:</b><input id="mdEm" type="number" min="0" max="59" placeholder="分"></div></div>
  <div class="mdb"><button class="btn pink" onclick="mdClose()">取消</button><button class="btn mint" onclick="mdOk()">確定</button></div>
</div></div>

<div id="tuOverlay" hidden onclick="closeTU()"><div id="tuBox"><div class="bell">🔔</div><div class="big">時間到 收卷囉！</div><div id="tuSub"></div></div></div>

<script>
const KEY="cuteExamTool_v1";
let D=load(),active=D.days[0].id;
function uid(){return"x"+Math.random().toString(36).slice(2,9)}
function def(){return{fs:16,days:[{id:uid(),title:"第1天段考",date:"",notice:"1. 桌面清空，只留文具\n2. 考試期間請保持安靜",subjects:[
  {id:uid(),name:"國文",start:"08:40",end:"09:30"},{id:uid(),name:"數學",start:"09:50",end:"10:40"}]}]}}
function load(){try{const r=JSON.parse(localStorage.getItem(KEY));if(r&&r.days&&r.days.length)return r}catch(e){}return def()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D))}catch(e){}}
function cur(){return D.days.find(d=>d.id===active)||D.days[0]}
const $=id=>document.getElementById(id);
const toMin=t=>{if(!t)return null;const[a,b]=t.split(":");return+a*60+ +b};
const pad=n=>String(n).padStart(2,"0");
const fmtMin=m=>pad(Math.floor(m/60))+":"+pad(m%60);

function applyZoom(){const r=document.documentElement.style;r.setProperty("--tn",D.tsNow||1);r.setProperty("--tc",D.tsNotice||1)}
function zoom(k,n){ // k: "now" 考試科目 / "notice" 公告
  const key=k==="now"?"tsNow":"tsNotice",lo=k==="now"?.3:.5,hi=3;
  const el=k==="now"?document.querySelector("#now .nm"):$("notice");
  const px=()=>el?parseFloat(getComputedStyle(el).fontSize):0;
  const old=D[key]||1,before=px();
  if(n>0&&old>=hi-1e-9){alert("字不能再大了");return}
  if(n<0&&old<=lo+1e-9){alert("字不能再小了");return}
  D[key]=Math.min(hi,Math.max(lo,old*(n>0?1.12:1/1.12)));
  applyZoom();fitNow();
  if(n>0&&px()<=before+.5){ // 已放不下外框，字無法再變大
    D[key]=old;applyZoom();fitNow();alert("字不能再大了");return}
  save()}

function renderTabs(){
  $("tabs").innerHTML="";
  D.days.forEach((d,i)=>{
    const b=document.createElement("button");b.className="tab"+(d.id===active?" on":"");b.textContent="Day"+(i+1);
    if(d.id===active&&D.days.length>1){const x=document.createElement("span");x.className="x";x.textContent="✕";x.title="刪除這一天";
      x.onclick=e=>{e.stopPropagation();if(confirm("確定刪除 Day"+(i+1)+" 嗎？")){D.days=D.days.filter(z=>z.id!==d.id);active=D.days[0].id;save();renderAll()}};b.appendChild(x)}
    b.onclick=()=>{active=d.id;renderAll()};$("tabs").appendChild(b)});
  const a=document.createElement("button");a.className="tab";a.textContent="＋新增考試日";
  a.onclick=()=>{const n=D.days.length+1;const d={id:uid(),title:"第"+n+"天段考",date:"",notice:"",subjects:[]};D.days.push(d);active=d.id;save();renderAll()};
  $("tabs").appendChild(a);
}

function sorted(){cur().subjects.sort((a,b)=>(toMin(a.start)??9999)-(toMin(b.start)??9999))}
let lastNow=null;
function setNow(H){if(H!==lastNow){lastNow=H;$("now").innerHTML='<div class="ni">'+H+'</div>';fitNow()}}
function fitNow(){ // 確保現在考試的字放大後不超出外框（以文字區塊本身的大小判斷）
  const b=$("now"),ni=b.firstElementChild;if(!ni)return;let f=1;b.style.setProperty("--fit",1);
  const pt=parseFloat(getComputedStyle(b).paddingTop)||0;
  const over=()=>{const r=ni.getBoundingClientRect();return r.height>b.clientHeight-pt+1||r.width>b.clientWidth+1||ni.scrollWidth>b.clientWidth+1};
  for(let i=0;i<120&&f>.12&&over();i++){f*=.98;b.style.setProperty("--fit",f)}
}
addEventListener("resize",fitNow);
try{new ResizeObserver(fitNow).observe($("now"))}catch(e){}
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitNow);

function renderRows(){
  sorted();const row=$("subRow");row.innerHTML="";const d=cur();
  if(!d.subjects.length){const e=document.createElement("div");e.className="empty";e.textContent="🌱 還沒有科目，按右邊「＋」新增吧！";row.appendChild(e)}
  d.subjects.forEach((s,i)=>{
    const b=document.createElement("div");b.className="blk c"+(i%3);b.id="r_"+s.id;b.tabIndex=0;b.title="點一下編輯";
    b.innerHTML='<div class="bn"></div><div class="bm"><div class="bt"><span></span> <span></span></div><span class="badge"></span></div>';
    b.querySelector(".bn").textContent=s.name||"（未命名）";
    const sp=b.querySelectorAll(".bt span");sp[0].textContent=s.start||"--:--";sp[1].textContent="~ "+(s.end||"--:--");
    b.onclick=()=>openModal(s.id);
    b.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();openModal(s.id)}};
    row.appendChild(b)});
  const p=document.createElement("button");p.className="blk plus";p.textContent="＋";p.title="新增科目";p.onclick=()=>openModal(null);row.appendChild(p);
}

// ===== 新增 / 編輯科目小視窗 =====
let MD=null;
function setTm(h,m,t){const v=toMin(t);$(h).value=v==null?"":pad(Math.floor(v/60));$(m).value=v==null?"":pad(v%60)}
function getTm(h,m){const a=$(h).value,b=$(m).value;if(a===""||b==="")return null;return pad(Math.min(23,Math.max(0,+a)))+":"+pad(Math.min(59,Math.max(0,+b)))}
function wireTm(hid,mid){
  const h=$(hid),m=$(mid);
  h.onkeydown=e=>{if(e.key!=="ArrowUp"&&e.key!=="ArrowDown")return;e.preventDefault();
    const d=e.key==="ArrowUp"?1:-1;h.value=pad(((+h.value||0)+d+24)%24)};
  m.onkeydown=e=>{if(e.key!=="ArrowUp"&&e.key!=="ArrowDown")return;e.preventDefault();
    const d=e.key==="ArrowUp"?1:-1;let v=(+m.value||0)+d,hh=+h.value||0;
    if(v>59){v-=60;hh=(hh+1)%24}else if(v<0){v+=60;hh=(hh+23)%24}
    h.value=pad(hh);m.value=pad(v)};
  h.onchange=()=>{if(h.value!=="")h.value=pad(Math.min(23,Math.max(0,+h.value)))};
  m.onchange=()=>{if(m.value!=="")m.value=pad(Math.min(59,Math.max(0,+m.value)))};
}
wireTm("mdSh","mdSm");wireTm("mdEh","mdEm");
function openModal(id){
  const d=cur();MD={id};
  let s=id?d.subjects.find(z=>z.id===id):null;
  if(!s){const last=d.subjects[d.subjects.length-1];
    const st=Math.min(last&&last.end?toMin(last.end)+10:8*60+40,23*60+19);
    s={name:"",start:fmtMin(st),end:fmtMin(st+40)}}
  $("mdTitle").textContent=id?"編輯科目":"新增科目";$("mdDel").hidden=!id;
  $("mdName").value=s.name||"";setTm("mdSh","mdSm",s.start);setTm("mdEh","mdEm",s.end);
  $("mdOverlay").hidden=false;$("mdName").focus();$("mdName").select();
}
function mdClose(){$("mdOverlay").hidden=true;MD=null}
function mdOk(){
  if(!MD)return;const d=cur(),name=$("mdName").value.trim(),a=getTm("mdSh","mdSm"),b=getTm("mdEh","mdEm");
  if(!a||!b){alert("請輸入完整的開始與結束時間");return}
  if(toMin(b)<=toMin(a)){alert("結束時間要晚於開始時間");return}
  const s=MD.id&&d.subjects.find(z=>z.id===MD.id);
  if(s){s.name=name;s.start=a;s.end=b}else d.subjects.push({id:uid(),name:name||"新科目",start:a,end:b});
  save();mdClose();renderRows();tick();
}
function mdDelete(){
  if(!MD||!MD.id)return;const d=cur(),s=d.subjects.find(z=>z.id===MD.id);
  if(s&&confirm("刪除「"+(s.name||"這個科目")+"」？")){d.subjects=d.subjects.filter(z=>z.id!==s.id);save();mdClose();renderRows();tick()}
}
document.addEventListener("keydown",e=>{
  if($("mdOverlay").hidden)return;
  if(e.key==="Escape")mdClose();
  else if(e.key==="Enter"&&e.target.tagName!=="BUTTON")mdOk();
});
$("mdOverlay").addEventListener("mousedown",e=>{if(e.target===$("mdOverlay"))mdClose()});

// status: 0 wait, 1 on, 2 end
function dayMode(d,now){return"today"; // before/after/today
  if(!d.date)return"today";
  const t=now.getFullYear()+"-"+pad(now.getMonth()+1)+"-"+pad(now.getDate());
  return d.date<t?"past":d.date>t?"future":"today";
}
function status(s,mode,m){
  if(mode==="past")return 2;if(mode==="future")return 0;
  const a=toMin(s.start),b=toMin(s.end);
  if(a==null||b==null)return 0;
  return m<a?0:m>=b?2:1;
}
const ST=[["尚未開始","s-wait"],["考試中","s-on"],["已結束","s-end"]];

function tick(){
  const now=new Date(),d=cur(),mode=dayMode(d,now);
  const sec=now.getHours()*3600+now.getMinutes()*60+now.getSeconds(),m=sec/60;
  $("clock").innerHTML=`${pad(now.getHours())}<i>:</i>${pad(now.getMinutes())}<i>:</i>${pad(now.getSeconds())}`;
  let on=null,next=null;
  d.subjects.forEach(s=>{
    const st=status(s,mode,m),tr=$("r_"+s.id);
    if(tr){const b=tr.querySelector(".badge");b.textContent=ST[st][0];b.className="badge "+ST[st][1];tr.classList.toggle("cur",st===1)}
    if(mode==="today"){const e=toMin(s.end);
      if(e!=null&&sec>=e*60&&sec<e*60+5&&!fired[s.id]){fired[s.id]=1;timesUp(s.name)}}
    if(st===1&&!on)on=s;
    if(st===0&&mode==="today"&&toMin(s.start)!=null&&!next)next=s;
  });
  const bar=$("bar"),txt=$("barTxt"),lab=$("bar-label");
  let H="",pct=0,t="",low=false,L="⚡ 能量條";
  const msg=(x,y)=>`<div class="nm">${x}</div>`+(y?`<small>${y}</small>`:"");
  if(mode==="past"){H=msg("🎉 這一天已經考完囉");t="已結束"}
  else if(mode==="future"){H=msg("📅 這天還沒到喔",esc(d.date));t="尚未開始"}
  else if(on){
    const a=toMin(on.start)*60,b=toMin(on.end)*60,left=Math.max(0,b-sec);
    H=msg(esc(on.name||"（未命名）"),on.start+" ~ "+on.end);
    pct=left/(b-a)*100;low=left<600;L="⚡ 考試剩餘時間";t="剩 "+Math.floor(left/60)+" 分 "+pad(left%60)+" 秒";
  }else if(next){
    const a=toMin(next.start)*60,left=a-sec;
    const prev=d.subjects.filter(s=>status(s,mode,m)===2).map(s=>toMin(s.end)*60).sort((x,y)=>y-x)[0];
    H=msg(prev!=null?"☕ 休息時間":"🌤️ 考試尚未開始","下一科："+esc(next.name)+"（"+next.start+"）");
    const span=prev!=null?a-prev:Math.max(left,1800);pct=Math.min(100,left/span*100);
    L="⚡ 距離下一科";t="還有 "+Math.floor(left/60)+" 分 "+pad(left%60)+" 秒";
  }else{
    H=msg(d.subjects.length?"🎉 今天的考試都結束了":"🌱 今天還沒有安排科目")}
  lab.textContent=L;setNow(H);
  bar.style.width=pct+"%";bar.classList.toggle("low",low);txt.textContent=t;
}
// ===== 時間到：跳出提示並響叮叮聲（持續 5 秒）=====
let AC=null,master=null,tUp=null;const fired={};
function unlock(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume()}catch(e){}}
["pointerdown","keydown","touchstart"].forEach(e=>addEventListener(e,unlock,{passive:true}));
function ding(t){
  [[1318.5,.6],[2637,.2],[3951,.08]].forEach(([f,g])=>{
    const o=AC.createOscillator(),v=AC.createGain();o.type="sine";o.frequency.value=f;
    v.gain.setValueAtTime(0,t);v.gain.linearRampToValueAtTime(g,t+.005);v.gain.exponentialRampToValueAtTime(.0001,t+.8);
    o.connect(v);v.connect(master);o.start(t);o.stop(t+.85)})
}
function timesUp(name){
  closeTU();
  $("tuSub").textContent=name?name+" 考試結束":"";$("tuOverlay").hidden=false;
  tUp=setTimeout(closeTU,5000);
  unlock();
  if(AC){try{
    master=AC.createGain();master.gain.value=.5;master.connect(AC.destination);
    const t=AC.currentTime+.05;
    for(let i=0;i<4;i++){ding(t+i*1.25);ding(t+i*1.25+.38)}
  }catch(e){}}
}
function closeTU(){
  clearTimeout(tUp);$("tuOverlay").hidden=true;
  if(master){try{master.gain.value=0;master.disconnect()}catch(e){}master=null}
}
function esc(s){return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]))}

let attT=null;
function attIn(k){
  const a=cur().att||(cur().att={});
  if(k!=="absent"){
    const sh=$("a_should").value,he=$("a_here").value;
    if(sh!==""&&he!=="")$("a_absent").value=String(Math.max(0,+sh-+he));
  }
  ["should","here","absent"].forEach(x=>a[x]=$("a_"+x).value);
  save();
  clearTimeout(attT);attT=setTimeout(attCheck,3000); // 輸入完 3 秒後檢查
}
function attFix(k){if($("a_"+k).value===""){$("a_"+k).value="0";attIn(k)}}
function attCheck(){
  const v=["should","here","absent"].map(x=>$("a_"+x).value);
  if(v.some(x=>x===""))return;
  if(+v[1]+ +v[2]>+v[0]){
    alert("已到加未到超過應到的呦");
    $("a_here").value=v[0];$("a_absent").value="0";
    attIn("absent");
  }
}
function toggleFull(){
  const el=document.documentElement,on=document.fullscreenElement||document.webkitFullscreenElement;
  try{
    if(on){(document.exitFullscreen||document.webkitExitFullscreen).call(document)}
    else if(el.requestFullscreen||el.webkitRequestFullscreen){(el.requestFullscreen||el.webkitRequestFullscreen).call(el)}
    else alert("這個瀏覽器不支援全螢幕 😢")
  }catch(e){alert("無法進入全螢幕 😢")}
}
function fsLabel(){$("fsBtn").textContent=(document.fullscreenElement||document.webkitFullscreenElement)?"🗗 退出全螢幕":"⛶ 全螢幕"}
document.addEventListener("fullscreenchange",fsLabel);document.addEventListener("webkitfullscreenchange",fsLabel);

function renderAll(){
  const d=cur();clearTimeout(attT);lastNow=null;
  ["should","here","absent"].forEach(k=>{$("a_"+k).value=(d.att&&d.att[k])||"0"});$("title").value=d.title;$("notice").value=d.notice||"";
  applyZoom();
  renderTabs();renderRows();tick();save();
}

function resetAll(){
  if(!confirm("確定要重設嗎？所有考試日、科目和公告都會恢復成預設內容。"))return;
  D=def();active=D.days[0].id;save();renderAll();
}
function exportData(){
  const j=JSON.stringify(D,null,2);
  try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([j],{type:"application/json"}));a.download="exam-data.json";a.click()}catch(e){}
  try{navigator.clipboard.writeText(j)}catch(e){}
}
function importData(el){
  const f=el.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const o=JSON.parse(r.result);if(!o.days||!o.days.length)throw 0;D=o;active=D.days[0].id;renderAll()}catch(e){alert("檔案格式不正確 😢")}};
  r.readAsText(f);el.value="";
}
renderAll();setInterval(tick,1000);
</script>
